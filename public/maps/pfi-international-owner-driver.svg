  <desc id="desc">A simplified owner-driver layout schematic for PF International, with three coloured track sectors and a dashed pit lane.</desc>
  <style>
    /* The sector colours read on either background, so only the surfaces and text swap.
       This follows the device colour scheme: an SVG shown through &lt;img&gt; is its own
       document and cannot see the app's manual light/dark toggle. */
    .map-bg { fill: #f7f8fb; }
    .map-caption { fill: #64748b; }
    .map-legend-surface { fill: #ffffff; stroke: #e2e8f0; }
    .map-legend-label { fill: #334155; }
    .map-shadow { stroke: #172033; }
    @media (prefers-color-scheme: dark) {
      .map-bg { fill: #131c29; }
      .map-caption { fill: #93a4bb; }
      .map-legend-surface { fill: #1c2735; stroke: #30405a; }
      .map-legend-label { fill: #ccd8e6; }
      .map-shadow { stroke: #05080d; }
    }
  </style>
