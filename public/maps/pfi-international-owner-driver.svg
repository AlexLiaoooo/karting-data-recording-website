<!--
  viewBox is cropped to the circuit rather than a wide 1200x900 canvas. The geometry spans
  x[83,739] y[83,817] once stroke width is included, so a landscape canvas left ~40% of the
  width empty and rendered the track small on a phone, where the image is width-constrained.
  Path coordinates are unchanged; only the frame, legend and caption positions moved.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 20 760 1000" role="img" aria-labelledby="title desc">
