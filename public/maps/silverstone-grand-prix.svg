<!--
  Generated by scripts/build-silverstone-map.mjs from scripts/data/silverstone-osm.json.
  Do not hand-edit: re-run the script instead, and re-paste the corner list it prints.

  Kart Silverstone is mapped as a connected network of raceway ways with no type=circuit relation
  and no oneway tagging, so neither the lap nor its direction comes from OpenStreetMap. The lap drawn
  here is pinned by hand in the generator: it is the closed lap closest to the 1,377 m the circuit
  publishes for its Grand Prix layout, and the best match against the operator's own diagram, but it
  is a reconstruction rather than a confirmed layout.

  No start/finish line and no direction arrow are drawn, because neither is known. The corner numbers
  the app shows are its own ordering of this geometry, not the circuit's.

  Length is the measured centreline. The artwork carries no light or dark theme; see the style block.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc">
  <title id="title">Kart Silverstone Grand Prix circuit schematic</title>
  <desc id="desc">A schematic of the Grand Prix circuit at Kart Silverstone, reconstructed from OpenStreetMap geometry. The racing direction is not shown because it is not recorded in the source.</desc>
  <style>
    /* An SVG shown through &lt;img&gt; is its own document: it cannot see the app's light/dark
       toggle, and following prefers-color-scheme instead put a dark map inside a light app
       whenever the two disagreed. So the artwork carries no background and no theme of its own.
       The app's map viewport supplies the surface, already themed, and every colour below is a
       mid-tone chosen to read on both of its backgrounds (#f5f7fb light, #1d2a3a dark). */
    .map-caption { fill: #7f8c9e; }
    .map-legend-surface { fill: #8896aa; fill-opacity: 0.14; stroke: #8896aa; stroke-opacity: 0.3; }
    .map-legend-label { fill: #7f8c9e; }
    .map-outline { stroke: #7f8c9e; }
    /* The start line and the direction arrow sit on the track itself, so they take their contrast
       from it rather than from the page, and white works the same in either theme. Their legend
       swatches sit on the panel instead and stay in the label colour. */
    .map-mark { fill: #ffffff; stroke: #ffffff; }
    .map-legend-mark { fill: #7f8c9e; stroke: #7f8c9e; }
  </style>
  <!-- The circuit name is deliberately absent: the app shows it in the top bar and as the page
       heading, so repeating it here put three copies on one screen. -->
  <text class="map-caption" x="60" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20">Grand Prix Circuit · 1,378 m centreline</text>

  <!-- A neutral outline rather than a drop shadow: it separates the track from the viewport grid
